name: Android CI Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify ARM64 Benchmark APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Benchmark APK (Release & Debug)
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify arm64-v8a Native Library
        run: |
          echo "=========================================="
          echo "Verifying compiled arm64-v8a binaries..."
          echo "=========================================="
          SO_FILE=$(find app/build/intermediates -name "libkomikku_benchmark.so" | grep "arm64-v8a" | head -n 1 || true)
          if [ -n "$SO_FILE" ] && [ -f "$SO_FILE" ]; then
            echo "✓ Found: $SO_FILE"
            readelf -h "$SO_FILE" | grep -E "Class:|Machine:" || true
          else
            echo "::notice:: Native library packaged directly into APK"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: komikku-benchmark-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: komikku-benchmark-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
